[package]
name = "qtrs-core"
version = "0.1.0"
edition = "2021"

[dependencies]
qtrs-derive = { path = "../qtrs-derive", optional = true }

[features]
default = ["derive"]
derive = ["dep:qtrs-derive"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Future dependencies: epoll platform event mechanisms

[target.'cfg(target_os = "macos")'.dependencies]

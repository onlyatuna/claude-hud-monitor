[package]
name = "claude-hud-monitor"
version = "0.2.0"
edition = "2021"
description = "AI Agent HUD Monitor (Claude / Antigravity / OpenAI Codex) — Rust port"
authors = []

[[bin]]
name = "ClaudeHUD"
path = "src/main.rs"

[dependencies]
# Qt Rust Engine Core
qtrs-core = { path = "qtrs/crates/qtrs-core" }
qtrs-gui = { path = "qtrs/crates/qtrs-gui" }
qtrs-platform = { path = "qtrs/crates/qtrs-platform" }
qtrs-widgets = { path = "qtrs/crates/qtrs-widgets" }
parking_lot = "0.12"

# HTTP (synchronous TLS client; providers already run on worker threads)
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# Image loading for tray icon

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon requires libappindicator on Linux
# tray-icon = "0.19"

[profile.release]
opt-level = "z"
# Measured on this repo (clean build / paint ms per Mpx): lto=true,cgu=1 219 s / 21.9; lto="thin" 122 s / 22.4;
# lto=false,cgu=16 100 s / 11.8. Likely cause (not verified): LTO re-optimises the rendering crates at the
# profile's opt-level="z", overriding the per-package opt-level=3 below.
lto = false
codegen-units = 16
incremental = false
strip = true
panic = "abort"

# The size-optimised default (`opt-level = "z"`) makes the software rasteriser 5-13x slower
# (1100x470 rounded rect: 3.8 ms at 3, 19 ms at z), which shows up as lag while resizing.
# Keep "z" for everything else and speed-optimise only the paint / text / layout / present path.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.fontdue]
opt-level = 3
[profile.release.package.rustybuzz]
opt-level = 3
[profile.release.package.ttf-parser]
opt-level = 3
[profile.release.package.qtrs-gui]
opt-level = 3
[profile.release.package.qtrs-widgets]
opt-level = 3
[profile.release.package.qtrs-platform]
opt-level = 3

[profile.dev]
opt-level = 1
incremental = true

[package]
name = "claude-hud-monitor"
version = "0.2.0"
edition = "2021"
description = "AI Agent HUD Monitor (Claude / Antigravity / OpenAI Codex) — Rust port"
authors = []

[[bin]]
name = "ClaudeHUD"
path = "src/main.rs"

[dependencies]
# UI library, a Rust implementation of a subset of Qt: https://github.com/onlyatuna/ferrokit
# Pinned to a commit. CI's `diagnostics` job checks out the same commit; change both together.
ferrokit-core = { git = "https://github.com/onlyatuna/ferrokit", rev = "8422301a609fc05d6a2fde6788e0423d1834bf21" }
ferrokit-gui = { git = "https://github.com/onlyatuna/ferrokit", rev = "8422301a609fc05d6a2fde6788e0423d1834bf21" }
ferrokit-platform = { git = "https://github.com/onlyatuna/ferrokit", rev = "8422301a609fc05d6a2fde6788e0423d1834bf21" }
ferrokit-widgets = { git = "https://github.com/onlyatuna/ferrokit", rev = "8422301a609fc05d6a2fde6788e0423d1834bf21" }
parking_lot = "0.12"

# HTTP (synchronous TLS client; providers already run on worker threads)
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# Image loading for tray icon

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon requires libappindicator on Linux
# tray-icon = "0.19"

[profile.release]
opt-level = "z"
# Measured on this repo (clean build / paint ms per Mpx): lto=true,cgu=1 219 s / 21.9; lto="thin" 122 s / 22.4;
# lto=false,cgu=16 100 s / 11.8. Likely cause (not verified): LTO re-optimises the rendering crates at the
# profile's opt-level="z", overriding the per-package opt-level=3 below.
lto = false
codegen-units = 16
incremental = false
strip = true
# Unwind (not abort) so the panic containment boundaries (signal slots, posted events, timers,
# WndProc/COM callbacks, provider workers) can catch a panic and keep running, as Python does.
panic = "unwind"

# The size-optimised default (`opt-level = "z"`) makes the software rasteriser 5-13x slower
# (1100x470 rounded rect: 3.8 ms at 3, 19 ms at z), which shows up as lag while resizing.
# Keep "z" for everything else and speed-optimise only the paint / text / layout / present path.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.ab_glyph_rasterizer]
opt-level = 3
[profile.release.package.rustybuzz]
opt-level = 3
[profile.release.package.ttf-parser]
opt-level = 3
[profile.release.package.ferrokit-gui]
opt-level = 3
[profile.release.package.ferrokit-widgets]
opt-level = 3
[profile.release.package.ferrokit-platform]
opt-level = 3

[profile.dev]
opt-level = 1
incremental = true

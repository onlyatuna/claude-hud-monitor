[package]
name = "claude-hud-monitor"
version = "0.2.0"
edition = "2024"
description = "AI Agent HUD Monitor (Claude / Antigravity / OpenAI Codex) — Rust port"
authors = []

[[bin]]
name = "ClaudeHUD"
path = "src/main.rs"

[dependencies]
# UI library, a Rust implementation of a subset of Qt: https://github.com/onlyatuna/ferrokit
# Pinned to a commit. CI's `diagnostics` job checks out the same commit; change both together.
ferrokit-core = { git = "https://github.com/onlyatuna/ferrokit", rev = "fdfaf52b7ff7830bf70d275f4bb9720ee679300d" }
ferrokit-gui = { git = "https://github.com/onlyatuna/ferrokit", rev = "fdfaf52b7ff7830bf70d275f4bb9720ee679300d" }
ferrokit-platform = { git = "https://github.com/onlyatuna/ferrokit", rev = "fdfaf52b7ff7830bf70d275f4bb9720ee679300d" }
ferrokit-widgets = { git = "https://github.com/onlyatuna/ferrokit", rev = "fdfaf52b7ff7830bf70d275f4bb9720ee679300d" }
parking_lot = "0.12"

# HTTP (synchronous TLS client; providers already run on worker threads)
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# Image loading for tray icon

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon requires libappindicator on Linux
# tray-icon = "0.19"

[profile.release]
opt-level = 3
# Measured on this repo (clean build / paint ms per Mpx): lto=true,cgu=1 219 s / 21.9; lto="thin" 122 s / 22.4;
# lto=false,cgu=16 100 s / 11.8. Keep lto=false, codegen-units=16 with uniform opt-level=3.
lto = false
codegen-units = 16
incremental = false
strip = true
# Unwind (not abort) so the panic containment boundaries (signal slots, posted events, timers,
# WndProc/COM callbacks, provider workers) can catch a panic and keep running, as Python does.
panic = "unwind"

[profile.dev]
opt-level = 1
incremental = true

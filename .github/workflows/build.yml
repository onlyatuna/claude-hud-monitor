name: Build Multiplatform Binaries (Windows & macOS)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build Windows Standalone EXE
        run: |
          pyinstaller --noconfirm --clean ClaudeHUD.spec
          if (Test-Path "dist/ClaudeHUD.exe") { Copy-Item "dist/ClaudeHUD.exe" "dist/ClaudeHUD-Windows.exe" }

      - name: Check packaged Windows app offline
        run: python -c "import subprocess; subprocess.run(['dist/ClaudeHUD-Windows.exe', '--smoke-test'], check=True, timeout=45)"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-Windows-x64
          path: dist/ClaudeHUD-Windows.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --clean ClaudeHUD.spec

      - name: Check packaged macOS app offline
        run: python -c "import subprocess; subprocess.run(['dist/ClaudeHUD.app/Contents/MacOS/ClaudeHUD', '--smoke-test'], check=True, timeout=45)"

      - name: Package macOS App into ZIP
        run: |
          cd dist
          zip -r ClaudeHUD-macOS-arm64.zip ClaudeHUD.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-macOS-arm64
          path: dist/ClaudeHUD-macOS-arm64.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ClaudeHUD-Windows-x64
          path: release-dist/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ClaudeHUD-macOS-arm64
          path: release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/ClaudeHUD-Windows.exe
            release-dist/ClaudeHUD-macOS-arm64.zip
          generate_release_notes: true

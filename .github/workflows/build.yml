name: Build Multiplatform Binaries (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pillow

      - name: Build Windows Standalone EXE
        run: |
          pyinstaller --noconsole --onefile --name "ClaudeHUD-Windows" --icon "assets/app_icon.ico" --add-data "assets;assets" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-Windows-x64
          path: dist/ClaudeHUD-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PySide6 pyinstaller pillow

      - name: Build macOS App Bundle
        run: |
          pyinstaller --windowed --name "ClaudeHUD" --icon "assets/app_icon.png" --add-data "assets:assets" main.py
          cd dist
          zip -r ClaudeHUD-macOS-arm64.zip ClaudeHUD.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-macOS-Universal
          path: dist/ClaudeHUD-macOS-arm64.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ClaudeHUD-Windows-x64
          path: release-dist/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ClaudeHUD-macOS-Universal
          path: release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/ClaudeHUD-Windows.exe
            release-dist/ClaudeHUD-macOS-arm64.zip
          generate_release_notes: true

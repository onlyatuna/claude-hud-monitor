name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A push is compared with the branch's commit before the push. Without this, a push to
          # any branch but the default one (main) was compared with main, so every develop push
          # matched every filter. Pull requests ignore `base` and use the PR's changed files. A
          # manual run has no commit before it (the action warns) and is compared with main.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            python:
              - 'python/**'
            workflow:
              - '.github/workflows/ci.yml'

  test-python:
    name: Python Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python/requirements-build.txt

      - name: Install dependencies
        working-directory: python
        run: uv pip install --system -r requirements-build.txt

      - name: Run Python regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

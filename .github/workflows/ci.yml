name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.workflow == 'true' }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A push is compared with the branch's commit before the push. Without this, a push to
          # any branch but the default one (main) was compared with main, so every develop push
          # matched every filter. Pull requests ignore `base` and use the PR's changed files. A
          # manual run has no commit before it (the action warns) and is compared with main.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          # A file counts for a filter only if it matches every pattern of it, so the `!` lines
          # exclude. Markdown under rust/ is documentation: no Rust target reads it. The Python
          # tests check the encoding of python/*.md, so those still run the Python job.
          predicate-quantifier: every
          filters: |
            python:
              - 'python/**'
            rust:
              - 'rust/**'
              - '!rust/**/*.md'
            workflow:
              - '.github/workflows/ci.yml'

  test-python:
    name: Python Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-build.txt

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run Python regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

  # Not a gate: reports what each runner lacks (fonts, shared libraries), so that a failure in
  # `test-rust` on an OS that cannot be reproduced locally can be read from this job's log, summary
  # and annotations instead of guessed at.
  diagnostics:
    name: Missing dependencies (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The library revision that rust/Cargo.toml pins; change both together.
      - name: Check out ferrokit
        uses: actions/checkout@v7
        with:
          repository: onlyatuna/ferrokit
          ref: 37deed88ed4b2dcddacfe27357d08b50fbefd382
          path: ferrokit

      # The runner image's stable Rust (rustup, with clippy and rustfmt); installing the newest
      # stable on every run took about 23 s on Windows.
      - name: Rust version
        run: rustc -V && cargo -V

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target, ferrokit -> target"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config

      - name: Fonts (requested vs installed)
        shell: bash
        working-directory: ferrokit
        run: |
          cargo run -q -p ferrokit-gui --example font_probe | tee "$RUNNER_TEMP/font-probe.txt"
          {
            echo "### Fonts on ${{ matrix.os }}"
            echo '```'
            sed -n '/--- font directories/,/--- numbers/p;/--- summary/,$p' "$RUNNER_TEMP/font-probe.txt" | grep -v '^::notice'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Platform font database vs ferrokit scan (Linux fontconfig, macOS CoreText)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo "### Platform font database on ${{ matrix.os }}"
            echo '```'
            python3 rust/tools/ci_platform_fonts.py "$RUNNER_TEMP/font-probe.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Shared libraries of the HUD binary (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: rust
        run: |
          cargo build -q
          bin=target/debug/ClaudeHUD
          {
            echo "### Shared libraries of ClaudeHUD on ${{ matrix.os }}"
            echo '```'
            if [ "$RUNNER_OS" = "Linux" ]; then
              ldd "$bin"
              echo "--- not found ---"
              ldd "$bin" | grep 'not found' || echo "(none)"
            else
              otool -L "$bin"
              echo "--- not under /usr/lib or /System ---"
              otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -v '^/usr/lib/' | grep -v '^/System/' || echo "(none)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Host
        shell: bash
        run: |
          { echo "### Host"; echo '```'; uname -a; [ "$RUNNER_OS" = "macOS" ] && sw_vers; [ "$RUNNER_OS" = "Linux" ] && lsb_release -a 2>/dev/null; rustc -V; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY" || true

  test-rust:
    name: Rust Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust version
        run: rustc -V && cargo -V && cargo clippy -V && cargo fmt --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config

      - name: Check (cargo check)
        working-directory: rust
        run: cargo check --all-features

      - name: Run Tests (cargo test)
        working-directory: rust
        run: cargo test --all-targets

      - name: Lint (clippy)
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Format (rustfmt)
        working-directory: rust
        run: cargo fmt --check

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'rust/**'
              - '.github/workflows/ci.yml'

  test-python:
    name: Python Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run Python regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

  # Not a gate: reports what each runner lacks (fonts, shared libraries), so that a failure in
  # `test-rust` on an OS that cannot be reproduced locally can be read from this job's log, summary
  # and annotations instead of guessed at.
  diagnostics:
    name: Missing dependencies (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target, rust/qtrs -> target"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config

      - name: Fonts (requested vs installed)
        shell: bash
        working-directory: rust/qtrs
        run: |
          cargo run -q -p qtrs-gui --example font_probe | tee "$RUNNER_TEMP/font-probe.txt"
          {
            echo "### Fonts on ${{ matrix.os }}"
            echo '```'
            sed -n '/--- font directories/,/--- numbers/p;/--- summary/,$p' "$RUNNER_TEMP/font-probe.txt" | grep -v '^::warning'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Platform font database vs qtrs scan (Linux fontconfig, macOS CoreText)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo "### Platform font database on ${{ matrix.os }}"
            echo '```'
            python3 rust/tools/ci_platform_fonts.py "$RUNNER_TEMP/font-probe.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Shared libraries of the HUD binary (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: rust
        run: |
          cargo build -q
          bin=target/debug/ClaudeHUD
          {
            echo "### Shared libraries of ClaudeHUD on ${{ matrix.os }}"
            echo '```'
            if [ "$RUNNER_OS" = "Linux" ]; then
              ldd "$bin"
              echo "--- not found ---"
              ldd "$bin" | grep 'not found' || echo "(none)"
            else
              otool -L "$bin"
              echo "--- not under /usr/lib or /System ---"
              otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -v '^/usr/lib/' | grep -v '^/System/' || echo "(none)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Host
        shell: bash
        run: |
          { echo "### Host"; echo '```'; uname -a; [ "$RUNNER_OS" = "macOS" ] && sw_vers; [ "$RUNNER_OS" = "Linux" ] && lsb_release -a 2>/dev/null; rustc -V; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY" || true

  test-rust:
    name: Rust Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config

      - name: Check (cargo check)
        working-directory: rust
        run: cargo check --all-features

      - name: Run Tests (cargo test)
        working-directory: rust
        run: cargo test --all-targets

      - name: Lint (clippy)
        working-directory: rust
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Format (rustfmt)
        working-directory: rust
        run: cargo fmt --check
        continue-on-error: true

  # Manual diagnostic run of the qtrs workspace (not a gate yet): the push gate above covers only
  # the main crate. Normal test threading on purpose, to surface parallel-isolation failures.
  test-qtrs:
    name: qtrs Workspace Test (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # Some tests are known to hang when run serially; cap a stuck run instead of the 6 h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/qtrs -> target"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config

      # Lists every target that does not compile on this platform; `cargo test` stops at the first.
      - name: Compile every qtrs target (cargo check --keep-going)
        working-directory: rust/qtrs
        run: cargo check -j 1 --workspace --all-targets --keep-going
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One binary at a time with a time limit each, so one hang does not hide the rest.
      - name: Run qtrs test binaries (per-binary timeout)
        working-directory: rust/qtrs
        # 120 s: about 5x the slowest normal target observed (test_tooltip, 23.1 s on Windows).
        run: python tools/run_test_binaries.py --timeout 120

      # libtest runs tests on worker threads; this runs GuiApplication/CoreApplication on the OS
      # main thread, one child process per check with its own time limit.
      - name: macOS main-thread entry (application dispatcher and event loop)
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        working-directory: rust/qtrs
        run: cargo run -j 1 -q -p qtrs-gui --example main_thread_entry

      # qtrs-platform AppKit checks (windows, status items, menus, screens, cursor, theme) on the
      # OS main thread, one child process per check, reporting ok/FAILED/ENV/CRASH per check.
      - name: macOS main-thread AppKit checks (qtrs-platform)
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        working-directory: rust/qtrs
        run: cargo run -j 1 -q -p qtrs-platform --example appkit_main_thread

      - name: Run qtrs doc tests
        if: ${{ !cancelled() }}
        working-directory: rust/qtrs
        run: cargo test -j 1 --workspace --doc

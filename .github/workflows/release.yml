name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Rust Multiplatform Builds ──────────────────────────────────────────
  build-rust:
    name: Build Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ClaudeHUD.exe
            asset_name: ClaudeHUD-Rust-Windows-x64.exe

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ClaudeHUD
            asset_name: ClaudeHUD-Rust-macos-arm64

          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ClaudeHUD
            asset_name: ClaudeHUD-Rust-macos-x86_64

          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ClaudeHUD
            asset_name: ClaudeHUD-Rust-Linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> rust/target"
          key: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev \
            libgl1-mesa-dev libgles2-mesa-dev pkg-config

      - name: Build Rust binary
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "rust\target\${{ matrix.target }}\release\${{ matrix.artifact }}" "${{ matrix.asset_name }}"

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}" "${{ matrix.asset_name }}"
          strip "${{ matrix.asset_name }}" || true
          chmod +x "${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  # ── macOS Rust Universal Binary ─────────────────────────────────────────
  rust-macos-universal:
    name: Rust macOS Universal Binary
    needs: build-rust
    runs-on: macos-latest
    steps:
      - name: Download macOS slices
        uses: actions/download-artifact@v4
        with:
          pattern: ClaudeHUD-Rust-macos-*
          merge-multiple: true

      - name: Create universal binary
        run: |
          lipo -create ClaudeHUD-Rust-macos-arm64 ClaudeHUD-Rust-macos-x86_64 -output ClaudeHUD
          chmod +x ClaudeHUD
          zip -r ClaudeHUD-Rust-macOS-Universal.zip ClaudeHUD

      - name: Upload universal binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-Rust-macOS-Universal.zip
          path: ClaudeHUD-Rust-macOS-Universal.zip
          retention-days: 1

  # ── Python Builds ───────────────────────────────────────────────────────
  build-python-windows:
    name: Build Python (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build Windows Standalone EXE
        working-directory: python
        run: |
          pyinstaller --noconfirm --clean ClaudeHUD.spec
          if (Test-Path "dist/ClaudeHUD.exe") { Copy-Item "dist/ClaudeHUD.exe" "..\ClaudeHUD-Python-Windows-x64.exe" }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-Python-Windows-x64.exe
          path: ClaudeHUD-Python-Windows-x64.exe
          retention-days: 1

  build-python-macos:
    name: Build Python (macos-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: python
        run: |
          python3 -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build macOS App Bundle
        working-directory: python
        run: |
          pyinstaller --noconfirm --clean ClaudeHUD.spec
          cd dist
          zip -r ../../ClaudeHUD-Python-macOS-arm64.zip ClaudeHUD.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHUD-Python-macOS-arm64.zip
          path: ClaudeHUD-Python-macOS-arm64.zip
          retention-days: 1

  # ── Unified Release Publisher ───────────────────────────────────────────
  publish:
    name: Publish Unified GitHub Release
    needs: [build-rust, rust-macos-universal, build-python-windows, build-python-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist/
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-dist
          sha256sum ClaudeHUD-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/ClaudeHUD-Rust-Windows-x64.exe
            release-dist/ClaudeHUD-Rust-macOS-Universal.zip
            release-dist/ClaudeHUD-Rust-Linux-x64
            release-dist/ClaudeHUD-Python-Windows-x64.exe
            release-dist/ClaudeHUD-Python-macOS-arm64.zip
            release-dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

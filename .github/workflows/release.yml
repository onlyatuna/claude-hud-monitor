name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-python-windows:
    name: Build Python (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build Windows Standalone EXE
        working-directory: python
        run: |
          pyinstaller --noconfirm --clean ClaudeHUD.spec
          if (Test-Path "dist/ClaudeHUD.exe") { Copy-Item "dist/ClaudeHUD.exe" "..\ClaudeHUD-Python-Windows-x64.exe" }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeHUD-Python-Windows-x64.exe
          path: ClaudeHUD-Python-Windows-x64.exe
          retention-days: 1

  build-python-macos:
    name: Build Python (macos-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: python
        run: |
          python3 -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -v

      - name: Build macOS App Bundle
        working-directory: python
        run: |
          pyinstaller --noconfirm --clean ClaudeHUD.spec
          cd dist
          zip -r ../../ClaudeHUD-Python-macOS-arm64.zip ClaudeHUD.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeHUD-Python-macOS-arm64.zip
          path: ClaudeHUD-Python-macOS-arm64.zip
          retention-days: 1

  # ── Unified Release Publisher ───────────────────────────────────────────
  publish:
    name: Publish Unified GitHub Release
    needs: [build-python-windows, build-python-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-dist/
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-dist
          sha256sum ClaudeHUD-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-dist/ClaudeHUD-Python-Windows-x64.exe
            release-dist/ClaudeHUD-Python-macOS-arm64.zip
            release-dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

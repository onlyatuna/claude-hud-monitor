name: Release

# Trigger: push a tag like "v0.1.0"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x86_64 ────────────────────────────────────────────
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: claude-hud-monitor.exe
            asset_name: claude-hud-monitor-windows-x86_64.exe

          # ── macOS Universal (arm64 native, cross-compile x86_64) ──────
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: claude-hud-monitor
            asset_name: claude-hud-monitor-macos-arm64

          - name: macos-x86_64
            os: macos-13        # last Intel runner
            target: x86_64-apple-darwin
            artifact: claude-hud-monitor
            asset_name: claude-hud-monitor-macos-x86_64

          # ── Linux x86_64 ─────────────────────────────────────────────
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: claude-hud-monitor
            asset_name: claude-hud-monitor-linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Linux system dependencies ───────────────────────────────────
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            pkg-config

      # ── Build ────────────────────────────────────────────────────────
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"   # macOS 11 Big Sur minimum

      # ── Rename and strip binary ──────────────────────────────────────
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.artifact }}" `
                    "${{ matrix.asset_name }}"

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "${{ matrix.asset_name }}"
          strip "${{ matrix.asset_name }}" || true
          chmod +x "${{ matrix.asset_name }}"

      # ── Upload macOS artifact for universal binary ───────────────────
      - name: Upload macOS slice artifact
        if: startsWith(matrix.name, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

      # ── Upload to GitHub Release ─────────────────────────────────────
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # "v1.0.0-beta" → pre-release

  # ── macOS Universal Binary (combines arm64 + x86_64 with lipo) ─────
  macos-universal:
    name: macOS Universal Binary
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download macOS slices
        uses: actions/download-artifact@v4
        with:
          pattern: claude-hud-monitor-macos-*
          merge-multiple: true

      - name: Create universal binary
        run: |
          if [ ! -f claude-hud-monitor-macos-arm64 ] || [ ! -f claude-hud-monitor-macos-x86_64 ]; then
            echo "Error: Missing macOS binaries for lipo!"
            ls -la
            exit 1
          fi
          lipo -create \
            claude-hud-monitor-macos-arm64 \
            claude-hud-monitor-macos-x86_64 \
            -output claude-hud-monitor-macos-universal
          chmod +x claude-hud-monitor-macos-universal

      - name: Upload universal binary
        uses: softprops/action-gh-release@v2
        with:
          files: claude-hud-monitor-macos-universal
          prerelease: ${{ contains(github.ref_name, '-') }}
